# IT Task List Management — automatic Apps Script update · autodeploy v1.5 (SOP autodeploy v1.3 + default deployment + target-project check)
# Every push that changes apps-script/** (or a manual "Run workflow") pushes the files to the Apps Script
# project and moves the EXISTING web-app deployment to a new version — the /exec URL stays the same.
# Secrets (Settings ▸ Secrets and variables ▸ Actions): CLASPRC_JSON · SCRIPT_ID   (DEPLOYMENT_ID optional — see below)
# SCRIPT_ID is per platform: copy it from the Task Register Sheet ▸ Extensions ▸ Apps Script ▸ Project Settings (never SOP's).
name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: ['apps-script/**', '.github/workflows/deploy-apps-script.yml']
  workflow_dispatch:

concurrency: apps-script-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SCRIPT_ID: ${{ secrets.SCRIPT_ID || vars.SCRIPT_ID }}
      # The platform's live web app (the ID inside its public /exec link). A DEPLOYMENT_ID secret/variable overrides it.
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID || vars.DEPLOYMENT_ID || 'AKfycbxRA9He5zQE5--S7RueMEbR7S1kIVyz1nFZCIcf_-vQoRXY9DszeqPtLv95VwRhKenV' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install clasp (pinned)
        run: npm install -g @google/clasp@2.4.2

      - name: Credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          miss=""
          [ -n "$CLASPRC_JSON" ]  || miss="$miss CLASPRC_JSON"
          [ -n "$SCRIPT_ID" ]     || miss="$miss SCRIPT_ID"
          [ -n "$DEPLOYMENT_ID" ] || miss="$miss DEPLOYMENT_ID"
          if [ -n "$miss" ]; then echo "::error::Missing repository secret(s):$miss — add them in Settings > Secrets and variables > Actions (Secrets or Variables tab; exact names)"; exit 1; fi
          echo "$CLASPRC_JSON" | grep -q '"refresh_token"' || { echo "::error::CLASPRC_JSON does not contain refresh_token — paste the whole content of .clasprc.json"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Keep the live project's manifest (appsscript.json)
        run: |
          mkdir -p /tmp/live && cd /tmp/live
          printf '{"scriptId":"%s"}' "$SCRIPT_ID" > .clasp.json
          clasp pull
          # Safety: the target project must own THIS platform's web app — otherwise SCRIPT_ID points to another
          # platform's project (e.g. SOP) and nothing may be pushed.
          clasp deployments > deployments.txt 2>&1 || true
          if ! grep -qF "$DEPLOYMENT_ID" deployments.txt; then
            echo "::error::SCRIPT_ID points to a different Apps Script project (it does not contain deployment ${DEPLOYMENT_ID:0:12}…). Nothing was pushed. Copy the Script ID from the Task Register Sheet: Extensions > Apps Script > Project Settings."
            echo "Files in that project:"; ls -1
            exit 1
          fi
          echo "Target project verified: it owns deployment ${DEPLOYMENT_ID:0:12}…"
          cp appsscript.json "$GITHUB_WORKSPACE/apps-script/appsscript.json"

      - name: Push files (Code, Index, Logos, Denied)
        working-directory: apps-script
        run: |
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          clasp push --force

      - name: New version on the same deployment (URL unchanged)
        working-directory: apps-script
        run: |
          VER=$(grep -oP "APP_VERSION\s*=\s*'\K[0-9.]+" Code.gs || echo "?")
          clasp deploy -i "$DEPLOYMENT_ID" -d "v$VER · ${GITHUB_SHA::7}"
          echo "### ✅ Apps Script updated to v$VER (same /exec URL)" >> "$GITHUB_STEP_SUMMARY"
